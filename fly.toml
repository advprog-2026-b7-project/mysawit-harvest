app = "mysawit-harvest"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  STORAGE_DIR = "/data/harvest/uploads"
  SERVER_SERVLET_CONTEXT_PATH = ""

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "harvest_uploads"
  destination = "/data/harvest/uploads"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
