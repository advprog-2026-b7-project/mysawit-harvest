spring.application.name=mysawit-harvest

server.port=8083

# === Shared Infrastructure Pattern ===
# This microservice connects to shared PostgreSQL instance via mysawit-infra
# 
# Profile Configurations:
# - dev: Development profile with PostgreSQL (application-dev.properties)
# - prod: Production profile with environment variables (application-prod.properties)
#
# To activate a profile:
#   - Set environment variable: SPRING_PROFILES_ACTIVE=dev
#   - Or run: java -jar app.jar --spring.profiles.active=dev
#
# Default configuration uses environment variables; use the dev profile for local defaults.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/mysawit_harvest}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Jakarta

# Flyway migration for deterministic schema management
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT validation, shared with mysawit-auth
jwt.secret=${JWT_SECRET:mysawit-secret}

# Auth service integration
auth.service.base-url=${AUTH_SERVICE_BASE_URL:http://localhost:8080}

# Payment service integration
payment.service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8084}

# File storage location for harvest photos
storage.harvest.dir=uploads/harvests
storage.harvest.public-base-url=${HARVEST_PUBLIC_BASE_URL:https://storage.mysawit.id}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

# Comma-separated frontend origins allowed to call this service.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Default logging level
logging.level.root=INFO
logging.level.id.ac.ui.cs.advprog=INFO
