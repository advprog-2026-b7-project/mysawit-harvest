# Production Configuration - mysawit-harvest Service
spring.application.name=mysawit-harvest

# PostgreSQL Database Configuration (Production)
# This service connects to shared infra PostgreSQL instance - credentials from environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JWT validation, shared with mysawit-auth
jwt.secret=${JWT_SECRET}

# Auth service integration
auth.service.base-url=${AUTH_SERVICE_BASE_URL}

# File storage location for harvest photos
storage.harvest.dir=${STORAGE_DIR:/opt/harvest/uploads}
storage.harvest.public-base-url=${HARVEST_PUBLIC_BASE_URL:https://mysawit-harvest.fly.dev}

# Comma-separated frontend origins allowed to call this service.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging
logging.level.root=WARN
logging.level.id.ac.ui.cs.advprog=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Server Configuration
server.port=8080
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:}
